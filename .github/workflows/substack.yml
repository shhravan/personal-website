# Copies posts from Shravan's Substack onto the blog (scripts/substack_sync.py).
# Substack can't notify us when a post goes up, so this checks once a month (1st, 09:17 UTC). To pull a new post
# straight away: GitHub → Actions → "Sync Substack" → Run workflow.
name: Sync Substack

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit the new pages back to the repo
  actions: write    # lets the job keep its own schedule switched on (see the last step)

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # retries on "too many requests" wait at most a few minutes; never hang for hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests must pass before anything is published
        run: python3 -m unittest discover -s tests
      - name: Fetch posts and build blog pages
        env:
          # Our Cloudflare Worker relay (worker/feed-relay.js); Substack blocks GitHub's machines.
          SUBSTACK_RELAY_URL: ${{ vars.SUBSTACK_RELAY_URL }}
          SUBSTACK_RELAY_KEY: ${{ secrets.SUBSTACK_RELAY_KEY }}
        run: python3 scripts/substack_sync.py
      - name: Commit if anything changed
        run: |
          git add blog
          if [ -d images/blog ]; then git add images/blog; fi
          if git diff --cached --quiet; then
            echo "No new or changed posts."
            exit 0
          fi
          git config user.name "substack-sync[bot]"
          git config user.email "substack-sync@users.noreply.github.com"
          git commit -m "Blog: sync posts from Substack"
          # someone may have merged to main while we ran: replay our commit on top instead of failing
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      # GitHub switches off scheduled jobs in public repos after 60 days without activity. Months
      # with no new posts make no commits, so the sync would quietly stop. Re-enabling the workflow
      # through GitHub's API resets that clock. It runs even if an earlier step failed, and never
      # fails the job itself.
      - name: Keep the monthly schedule switched on
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/substack.yml/enable"
          echo "Schedule kept alive."
