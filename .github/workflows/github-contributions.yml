# Refreshes the GitHub contribution graph on the projects page (scripts/github_contributions.py).
# Runs every night (03:23 UTC). To refresh straight away: GitHub → Actions → "GitHub contributions" → Run workflow.
name: GitHub contributions

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit data/github.json
  actions: write    # lets the job keep its own schedule switched on (see the last step)

concurrency:
  group: github-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the contribution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_contributions.py
      - name: Commit if it changed
        run: |
          git add data/github.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-contributions[bot]"
          git config user.email "github-contributions@users.noreply.github.com"
          git commit -m "Projects: refresh GitHub contribution graph"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      # Scheduled jobs in public repos switch off after 60 days without activity; this resets that.
      - name: Keep the nightly schedule switched on
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/github-contributions.yml/enable"
