<body>
  <!-- Same top bar, letter field and sign-off as the home page (see docs/DESIGN.md), minus the photo. -->
  <a class="logo" href="../" aria-label="श्रवण लाड · Shravan Lad, home"></a>
  <main class="col page photos">

    <!-- Two tabs. Each roll (Film Gallery) or project (Commercial) is a straight film strip drawn by
         script.js (startPhotography / startFilm); the list of buttons under each strip is the same
         photos for keyboards and screen readers, and holds each photo's caption and details.
         PLACEHOLDER: rolls, photos, captions and the sample project are stand-ins. -->
    <!-- The landing: two film cans, drawn in 3D by photography/cans.js. Pick one and its film pours
         out over the page, then settles into that roll's strips; the cans stay on top as the switch.
         Without 3D (or if it fails to load) the page falls back to the plain tabs below. -->
    <section class="cans" aria-label="choose a roll">
      <div class="cans-stage"><canvas class="cans-gl" role="img" aria-label="two film canisters: film gallery and commercial. drag to turn them."></canvas></div>
      <button type="button" class="can-name" aria-pressed="false">film gallery</button>
      <button type="button" class="can-name" aria-pressed="false">commercial</button>
      <!-- the prompts, framed like a camera's viewfinder -->
      <p class="cans-hint vf"><span class="vf-read" aria-hidden="true">1/125 · f2.8 · iso 400</span><span class="vf-text">pick a roll</span></p>
      <button type="button" class="cans-skip" hidden>skip</button>
      <button type="button" class="cans-back vf"><span class="vf-read" aria-hidden="true">36 exp · advance ▸</span><span class="vf-text">another shot</span></button>
    </section>

    <nav class="photo-tabs" role="tablist" aria-label="photography">
      <button type="button" role="tab" aria-selected="true">Film Gallery</button>
      <button type="button" role="tab" aria-selected="false">Commercial</button>
    </nav>

    <div class="photo-pane">
        <section class="roll">
          <canvas data-wave="0" data-fit="6" data-label="mumbai, monsoon · roll 01" tabindex="-1" role="img" aria-label="film strip: mumbai, monsoon"></canvas>
          <ul class="roll-list">
            <li><button type="button" data-name="tram" data-caption="tram, mumbai" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open tram, mumbai</button></li>
            <li><button type="button" data-name="classroom" data-caption="classroom" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open classroom</button></li>
            <li><button type="button" data-name="rain" data-caption="rain" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open rain</button></li>
            <li><button type="button" data-name="crowd" data-caption="crowd" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open crowd</button></li>
            <li><button type="button" data-name="garden-party" data-caption="garden party" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open garden party</button></li>
            <li><button type="button" data-name="dwarka" data-caption="dwarka" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open dwarka</button></li>
            <li><button type="button" data-name="wall-street" data-caption="wall street" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open wall street</button></li>
            <li><button type="button" data-name="esplanade-dusk" data-caption="esplanade at dusk" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open esplanade at dusk</button></li>
          </ul>
        </section>
        <section class="roll">
          <canvas data-wave="0" data-fit="6" data-label="home, surat · roll 02" tabindex="-1" role="img" aria-label="film strip: home, surat"></canvas>
          <ul class="roll-list">
            <li><button type="button" data-name="vitthal" data-caption="vitthal" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open vitthal</button></li>
            <li><button type="button" data-name="shivaji" data-caption="shivaji" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open shivaji</button></li>
            <li><button type="button" data-name="natsamrat" data-caption="natsamrat" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open natsamrat</button></li>
            <li><button type="button" data-name="partha-sarathi" data-caption="partha sarathi" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open partha sarathi</button></li>
            <li><button type="button" data-name="tumbbad" data-caption="tumbbad" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open tumbbad</button></li>
            <li><button type="button" data-name="the-choice" data-caption="the choice" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open the choice</button></li>
            <li><button type="button" data-name="creation-of-adam" data-caption="creation of adam" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open creation of adam</button></li>
          </ul>
        </section>
        <section class="roll">
          <canvas data-wave="0" data-fit="6" data-label="ithaca, first winter · roll 03" tabindex="-1" role="img" aria-label="film strip: ithaca, first winter"></canvas>
          <ul class="roll-list">
            <li><button type="button" data-name="cornell-1930" data-caption="cornell, 1930" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open cornell, 1930</button></li>
            <li><button type="button" data-name="harvey-mike" data-caption="harvey and mike" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open harvey and mike</button></li>
            <li><button type="button" data-name="stone-cold" data-caption="stone cold" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open stone cold</button></li>
            <li><button type="button" data-name="oasis" data-caption="oasis" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open oasis</button></li>
            <li><button type="button" data-name="queen" data-caption="queen" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open queen</button></li>
            <li><button type="button" data-name="shawshank" data-caption="shawshank" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open shawshank</button></li>
            <li><button type="button" data-name="sisyphus" data-caption="sisyphus" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open sisyphus</button></li>

    <div class="photo-pane" hidden>
        <section class="roll">
          <canvas data-wave="0" data-fit="6" data-label="sample project" data-leader="sample project|client · 2026" tabindex="-1" role="img" aria-label="film strip: sample project"></canvas>
          <ul class="roll-list">
            <li><button type="button" data-name="pcrc-beta" data-caption="frame one" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open frame one</button></li>
            <li><button type="button" data-name="znmd" data-caption="frame two" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open frame two</button></li>
            <li><button type="button" data-name="great-wave" data-caption="frame three" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open frame three</button></li>
            <li><button type="button" data-name="shutter-island" data-caption="frame four" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open frame four</button></li>
            <li><button type="button" data-name="basquiat" data-caption="frame five" data-place="placeholder place" data-year="2025" data-film="portra 400 · 35mm">open frame five</button></li>
          </ul>
        </section>
    </div>

    <dialog class="lightbox" aria-label="photo">
      <button type="button" class="lb-back" aria-label="back">← back</button>
      <button type="button" class="lb-prev" aria-label="previous photo">‹</button>
      <figure><img alt=""><figcaption class="lb-cap"></figcaption></figure>
