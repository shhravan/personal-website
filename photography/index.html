    <h1>photography</h1>
    <p class="lede">film photos, a roll at a time.</p>

    <nav class="rolls" role="tablist" aria-label="rolls"><button type="button" role="tab" aria-selected="true">mumbai, monsoon</button><button type="button" role="tab" aria-selected="false">home, surat</button><button type="button" role="tab" aria-selected="false">ithaca, first winter</button></nav>
