<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The desk: Shravan's private dashboard. Served by its own Cloudflare Pages site, behind
       Cloudflare Access (email code login). Never linked from the public site. See README.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>desk</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desk.css">
  <script type="module" src="desk.js"></script>
</head>
<body>
  <header class="top">
    <h1>desk</h1>
    <nav class="links" aria-label="elsewhere">
      <a class="preview-link" href="#" target="_blank" rel="noopener" hidden>preview drafts ↗</a>
      <a href="https://shravanlad.com/photography/" target="_blank" rel="noopener">live site ↗</a>
      <a href="/cdn-cgi/access/logout">log out</a>
    </nav>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="which photos">
      <button type="button" role="tab" aria-selected="true" data-kind="gallery">film gallery</button>
      <button type="button" role="tab" aria-selected="false" data-kind="commercial">commercial</button>
    </nav>
    <p class="loading">opening the desk…</p>
    <div class="rolls"></div>
    <button type="button" class="new-roll" hidden>+ new roll</button>
  </main>

  <!-- Saving and publishing stay at the bottom of the screen, under your thumb on a phone. -->
  <footer class="bar">
    <p class="status" role="status" aria-live="polite"></p>
    <button type="button" class="save" disabled>save</button>
    <button type="button" class="publish" disabled>publish</button>
  </footer>

  <!-- One photo, full size, with everything you can write about it. -->
  <dialog class="editor" aria-label="edit photo">
    <div class="ed-top">
      <button type="button" class="ed-close">← done</button>
      <span class="ed-count"></span>
      <span class="ed-nav">
        <button type="button" class="ed-prev" aria-label="previous photo">‹</button>
        <button type="button" class="ed-next" aria-label="next photo">›</button>
      </span>
    </div>
    <div class="ed-body">
      <figure class="focus">
        <img alt="">
        <span class="focus-dot" aria-hidden="true"></span>
        <figcaption>tap the photo to choose what stays in view on the film strip</figcaption>
      </figure>
      <div class="fields">
        <label class="wide">caption <input name="caption" maxlength="120" autocomplete="off"></label>
        <label>place <input name="place" maxlength="80" autocomplete="off"></label>
        <label>year <input name="year" maxlength="12" inputmode="numeric" autocomplete="off"></label>
        <label>film <input name="film" maxlength="60" placeholder="portra 400 · 35mm" autocomplete="off"></label>
        <label>camera <input name="camera" maxlength="60" autocomplete="off"></label>
        <label class="wide">settings <input name="settings" maxlength="60" placeholder="1/125 · f2.8 · iso 400" autocomplete="off"></label>
        <label class="wide">alt text <span class="hint">what's in the photo, for people who can't see it. blank uses the caption.</span>
          <textarea name="alt" maxlength="300" rows="2"></textarea></label>
        <label class="wide">zoom on the strip <input name="zoom" type="range" min="1" max="2" step="0.05"></label>
        <p class="found wide"></p>
        <div class="ed-tools wide">
          <label>roll <select name="roll"></select></label>
          <button type="button" class="ed-earlier">← earlier</button>
          <button type="button" class="ed-later">later →</button>
          <label class="check"><input type="checkbox" name="hidden"> hidden</label>
          <button type="button" class="ed-delete danger">delete photo</button>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
